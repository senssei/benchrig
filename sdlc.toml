# Project-owned checks; shared runner installed from local-sdlc-kit.
base = "main"
shell = false

[[check]]
name = "tests"
run = ".venv/bin/python -m pytest"
timeout = 300

[[check]]
name = "lint"
run = ".venv/bin/ruff check ."

[[check]]
name = "format"
run = ".venv/bin/ruff format --check ."

[changelog]
file = "CHANGELOG.md"
runtime_paths = ["benchrig/"]

[red]
run = ".venv/bin/python -m pytest -x -q {id}"
timeout = 300
not_found = ["no tests ran", "^ERROR: (file or directory )?not found", "ERROR collecting"]
ignore = ["^FAILED\\b", "^\\d+ (failed|passed)", "^=+ ", "^={3,}", "^!+"]
