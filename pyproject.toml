[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchrig"
dynamic = ["version"]
description = "Benchmarking and profiling rig for local LLMs on Ollama, Microsoft Foundry Local, and ONNX Runtime GenAI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafal Warzycha" }]
keywords = ["llm", "benchmark", "ollama", "foundry-local", "onnxruntime-genai", "cuda", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8.0"]
onnx-gpu = ["onnxruntime-genai-cuda"]
dev = ["pytest>=8.0", "ruff>=0.6", "build", "twine"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/senssei/benchrig"
Documentation = "https://senssei.github.io/benchrig/"
Issues = "https://github.com/senssei/benchrig/issues"
Changelog = "https://github.com/senssei/benchrig/blob/main/CHANGELOG.md"

[project.scripts]
benchrig = "benchrig.cli:main"

[tool.setuptools.packages.find]
include = ["benchrig*"]

[tool.setuptools.package-data]
benchrig = ["data/*.yaml", "data/scenarios/*.json"]

[tool.setuptools.dynamic]
version = { attr = "benchrig.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "models", "results"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
]
ignore = [
    "E501",  # line length is enforced by the formatter where practical
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests extend sys.path before importing the modules under test
